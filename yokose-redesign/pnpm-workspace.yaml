minimumReleaseAgeExclude:
  - vite@8.3.5
# This project does not use pnpm workspaces (single package). This file exists
# only to host `overrides`, which pnpm (>=10) requires to live here instead of
# the `pnpm` field in package.json.
#
# These overrides force transitive dev-dependency versions up to the lowest
# version that fixes known advisories, re-verified via `pnpm audit` against
# the GitHub Advisory Database on 2026-10-21. See PR description for the
# advisory IDs this addresses.
overrides:
  vite: "8.3.5"
  postcss: "8.5.31"
  postcss-selector-parser: "7.1.7"
  js-yaml: "4.3.2"
  nanoid: "3.3.20"
  browserslist: "4.29.4"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@5": "5.0.12"
  baseline-browser-mapping: "2.11.30"
  "@babel/core": "7.29.7"
